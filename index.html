<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Asosiy sahifa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }
        body {
            background-color: #ffffff;
            color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            border: 3px solid #000;
            padding: 50px 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 15px 15px 0px #000;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu { display: flex; flex-direction: column; gap: 15px; }
        .menu a {
            text-decoration: none;
            color: #fff;
            background-color: #000;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #000;
            transition: 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }
        .menu a:hover {
            background-color: #fff;
            color: #000;
            transform: translate(-5px, -5px);
            box-shadow: 5px 5px 0px #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MENYU</h1>
        <div class="menu">
            <a href="Aholi.html">AHOLI</a>
            <a href="Hodimlar.html">HODIMLAR</a>
            <a href="Prokuror.html">PROKUROR</a>
        </div>
    </div>
</body>
</html>
